name: 01 - CI

on:
  # Trigger the workflow on push to main branch
  push:
    branches:
      - main

  # Manual trigger for the workflow
  workflow_dispatch:

# Required so azure/login can request an OIDC token from GitHub and exchange
# it for an Azure access token via the sit722-gha-id federated identity
# credential (see terraform-plan job below). Without id-token: write, the
# OIDC handshake fails before it even reaches Azure.
permissions:
  id-token: write
  contents: read

jobs:

  # =========================================================
  # Terraform Validate (Infrastructure as Code check)
  # =========================================================
  # Runs independently of the test/build jobs, since it validates the
  # Terraform *configuration* (syntax, internal consistency, provider
  # schema correctness) rather than anything about the application code.
  #
  # NOTE: this deliberately uses `terraform validate` only, not `plan` or
  # `apply`, and never authenticates to Azure. It checks the *configuration*
  # (syntax, internal consistency, provider schema) so it runs fast and
  # fails early even if Azure auth or the terraform-plan job below has an
  # issue. The real, authenticated `plan` against Azure runs immediately
  # after in the terraform-plan job, via the sit722-gha-id OIDC identity.
  terraform-validate:
    name: Terraform Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform format check
        working-directory: terraform
        run: terraform fmt -check -recursive
        continue-on-error: true

      - name: Terraform init (no backend, no cloud auth required)
        working-directory: terraform
        run: terraform init -backend=false

      - name: Terraform validate
        working-directory: terraform
        run: terraform validate


  # =========================================================
  # Terraform Plan (real Azure execution, Task 10.2D)
  # =========================================================
  # Unlike terraform-validate above (config-only, no cloud auth), this job
  # actually authenticates to Azure and runs `terraform plan` against the
  # live tfstate-rg backend and real subscription. This was previously done
  # only from a local machine because this CloudLabs Azure tenant blocks
  # self-service Entra *application* registration -- but a *user-assigned
  # managed identity* with a federated (OIDC) credential is not blocked, and
  # one (`sit722-gha-id`) was created for exactly this purpose. GitHub's
  # OIDC token is exchanged for a short-lived Azure access token at run
  # time, so no long-lived Azure secret is ever stored in the repo.
  #
  # This deliberately runs `plan` only, not `apply`. Plan is sufficient to
  # demonstrate that Terraform authenticates and executes correctly inside
  # the pipeline (the Task 10.2D requirement), while keeping infrastructure
  # changes to the live AKS cluster a reviewed, deliberate action rather
  # than something that fires unattended on every push to main.
  terraform-plan:
    name: Terraform Plan (Azure)
    runs-on: ubuntu-latest
    needs:
      - terraform-validate

    # These let both the azurerm *backend* (state storage) and the azurerm
    # *provider* (resource management) authenticate via OIDC natively,
    # independently of the az CLI session azure/login sets up below. This
    # is the auth path HashiCorp documents for GitHub Actions + Azure OIDC,
    # and avoids relying on az CLI credential passthrough for `terraform
    # init`/`plan`.
    env:
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      ARM_USE_OIDC: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Azure login (OIDC via sit722-gha-id federated identity)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform init (real backend)
        working-directory: terraform
        run: terraform init

      - name: Terraform plan
        working-directory: terraform
        run: terraform plan -input=false


  # =========================================================
  # Backend Tests
  # =========================================================
  backend-test:
    name: Test ${{ matrix.service }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false

      matrix:
        include:
          - service: user-service
            database: users
            port: 5433

          - service: student-service
            database: students
            port: 5434

          - service: lecturer-service
            database: lecturers
            port: 5435

          - service: course-service
            database: courses
            port: 5436

          - service: enrollment-service
            database: enrollments
            port: 5437

    services:
      postgres:
        image: postgres:16

        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ${{ matrix.database }}

        ports:
          - ${{ matrix.port }}:5432

        options: >-
          --health-cmd="pg_isready -U postgres -d ${{ matrix.database }}"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ${{ matrix.database }}
      POSTGRES_HOST: localhost
      POSTGRES_PORT: ${{ matrix.port }}

      JWT_SECRET_KEY: koalatech-ci-test-secret
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30

      DEFAULT_ADMIN_USERNAME: admin
      DEFAULT_ADMIN_EMAIL: admin@koalatech.edu.au
      DEFAULT_ADMIN_PASSWORD: AdminPassword123!

      AZURE_STORAGE_CONNECTION_STRING: ""
      AZURE_STORAGE_CONTAINER_NAME: ""

    steps:

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: ${{ matrix.service }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        working-directory: ${{ matrix.service }}
        run: |
          pytest -v


  # =========================================================
  # Build, Scan and Push Docker Images
  # =========================================================
  build-and-push:
    name: Build and Push ${{ matrix.image }}
    runs-on: ubuntu-latest

    # All backend tests must pass before this job starts
    needs:
      - backend-test

    # Build and push when code is pushed to main or manually triggered
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    strategy:
      fail-fast: false

      matrix:
        include:
          - service: frontend
            image: koalatech-frontend

          - service: user-service
            image: koalatech-user-service

          - service: student-service
            image: koalatech-student-service

          - service: lecturer-service
            image: koalatech-lecturer-service

          - service: course-service
            image: koalatech-course-service

          - service: enrollment-service
            image: koalatech-enrollment-service

    steps:

      - name: Checkout repository
        uses: actions/checkout@v6

      # NOTE: This CloudLabs Azure tenant does not permit self-service
      # Microsoft Entra app/service-principal registration, so the
      # azure/login + az acr login approach from the README cannot be
      # used here. Instead we authenticate directly to ACR using its
      # built-in admin user (username/password), configured as the
      # ACR_USERNAME / ACR_PASSWORD repository secrets.
      - name: Login to Azure Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ vars.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build Docker image
        run: |
          docker build \
            --platform linux/amd64 \
            -t ${{ vars.ACR_LOGIN_SERVER }}/${{ matrix.image }}:${{ github.sha }} \
            ./${{ matrix.service }}

      # -----------------------------------------------------
      # Docker Scout vulnerability scan
      # -----------------------------------------------------
      # Runs after the image is built but BEFORE it is pushed to ACR, so
      # scan results are available for every image on every CI run without
      # ever gating the push on them. Docker Scout itself is tied to a
      # Docker Hub account (separate from ACR), so a short-lived, read-only
      # Docker Hub login is required purely to authorise the scan -- this
      # has no relationship to where the image is actually stored.
      #
      # exit-code is left false (report-only) rather than failing the
      # build on High/Critical findings: several of the base Python images
      # shared across all six services currently carry known, still-being-
      # patched-upstream CVEs (see Task 10.1P), so a hard gate here would
      # block every build until every upstream dependency catches up. The
      # scan output is still produced and reviewed every run, which is the
      # DevSecOps value -- continuous visibility -- without turning a
      # known, tracked issue into a blanket pipeline outage.
      - name: Login to Docker Hub (required for Docker Scout)
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker Scout - vulnerability scan
        uses: docker/scout-action@v1
        with:
          command: cves,recommendations
          image: ${{ vars.ACR_LOGIN_SERVER }}/${{ matrix.image }}:${{ github.sha }}
          only-severities: critical,high
          exit-code: false
          summary: true

      - name: Push Docker image with commit SHA
        run: |
          docker push \
            ${{ vars.ACR_LOGIN_SERVER }}/${{ matrix.image }}:${{ github.sha }}
